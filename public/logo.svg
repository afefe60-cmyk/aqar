<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="goldSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="estatePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (Compact Version) -->
  <g transform="translate(30, 30)">
    <!-- Rounded Background Squircle -->
    <rect width="180" height="180" rx="42" fill="url(#estatePill)" />
    
    <!-- Golden Accent Arc -->
    <path d="M 28 135 C 55 162, 125 162, 155 125 C 135 150, 65 145, 36 130 Z" fill="url(#goldSwoosh)" />

    <!-- Architectural Silhouette -->
    <g transform="translate(32, 28) scale(0.62)">
      <!-- Tower -->
      <path d="M 100 30 L 160 30 L 160 170 L 100 170 Z" fill="#e2e8f0" />
      <rect x="112" y="45" width="14" height="12" fill="#78350f" />
      <rect x="134" y="45" width="14" height="12" fill="#78350f" />
      <rect x="112" y="70" width="14" height="12" fill="#78350f" />
      <rect x="134" y="70" width="14" height="12" fill="#78350f" />
      <rect x="112" y="95" width="14" height="12" fill="#78350f" />
      <rect x="134" y="95" width="14" height="12" fill="#78350f" />
      
      <!-- House / Villa -->
      <path d="M 10 100 L 75 45 L 135 95 L 122 105 L 75 65 L 20 110 Z" fill="url(#goldSwoosh)" />
      <path d="M 25 110 L 110 110 L 110 170 L 25 170 Z" fill="#ffffff" />
      <rect x="45" y="125" width="20" height="22" rx="3" fill="#fbbf24" />
      <path d="M 75 125 L 98 125 L 98 170 L 75 170 Z" fill="#166534" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(245, 40)">
    <!-- "SudanZon" Wordmark -->
    <text x="0" y="80" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5">
      <tspan fill="#1e3a2b">Sudan</tspan>
      <tspan fill="#f59e0b">Zon</tspan>
    </text>

    <!-- The Signature Golden Arrow / Swoosh underneath -->
    <path d="M 10 102 Q 220 145, 360 88 L 348 80 L 382 92 L 362 118 L 354 105 Q 220 155, 10 110 Z" 
          fill="url(#goldSwoosh)" />

    <!-- "REAL ESTATE" Pill Badge -->
    <g transform="translate(2, 125)" filter="url(#badgeShadow)">
      <rect width="280" height="52" rx="26" fill="url(#estatePill)" />
      <text x="140" y="36" 
            text-anchor="middle" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="25" 
            font-weight="900" 
            fill="#ffffff" 
            letter-spacing="3">
        REAL ESTATE
      </text>
    </g>

    <!-- Arabic Subtitle "العقارات" -->
    <text x="390" y="162" 
          font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif" 
          font-size="34" 
          font-weight="bold" 
          fill="#b45309" 
          direction="rtl">
      العقارات
    </text>
  </g>
</svg>
