<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="estateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Architecture Gradient -->
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="estateShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#estateBg)" />

  <!-- Ambient Light Circle -->
  <circle cx="256" cy="180" r="140" fill="#f59e0b" opacity="0.2" />

  <!-- Dynamic Golden Speed Arc / Foundation Arc -->
  <path d="M 85 365 C 150 425, 360 430, 425 345 C 370 405, 180 400, 105 350 Z" 
        fill="url(#goldSwoosh)" filter="url(#goldGlow)" />

  <!-- Architectural Composition (Modern Villa + High-Rise Tower) -->
  <g filter="url(#estateShadow)" transform="translate(0, -10)">
    <!-- High-rise Building (Right) -->
    <path d="M 285 140 L 375 140 C 380 140, 385 145, 385 150 L 385 345 L 285 345 Z" 
          fill="#e2e8f0" opacity="0.95" />
    <!-- Tower Windows Rows -->
    <g fill="#92400e" opacity="0.65">
      <rect x="302" y="165" width="22" height="18" rx="3" />
      <rect x="345" y="165" width="22" height="18" rx="3" />
      <rect x="302" y="200" width="22" height="18" rx="3" />
      <rect x="345" y="200" width="22" height="18" rx="3" />
      <rect x="302" y="235" width="22" height="18" rx="3" />
      <rect x="345" y="235" width="22" height="18" rx="3" />
      <rect x="302" y="270" width="22" height="18" rx="3" />
      <rect x="345" y="270" width="22" height="18" rx="3" />
    </g>

    <!-- Modern Villa / House Roof & Structure (Foreground / Left) -->
    <!-- Pitched Roof -->
    <path d="M 120 250 L 225 160 L 315 235 L 300 248 L 225 185 L 135 262 Z" 
          fill="url(#goldSwoosh)" />
    
    <!-- House Main Body -->
    <path d="M 140 262 L 290 262 C 295 262, 300 267, 300 272 L 300 350 L 140 350 Z" 
          fill="url(#archGrad)" />

    <!-- Modern House Doorway with Emerald/Green Tone -->
    <path d="M 195 285 L 235 285 C 240 285, 245 290, 245 295 L 245 350 L 195 350 Z" 
          fill="#166534" />

    <!-- Window Accent (Warm Glow) -->
    <rect x="155" y="285" width="25" height="28" rx="4" fill="#fbbf24" opacity="0.9" />
    <rect x="258" y="285" width="25" height="28" rx="4" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Location Pin / Key Accent -->
  <g transform="translate(256, 120)">
    <circle cx="0" cy="0" r="16" fill="#fbbf24" filter="url(#goldGlow)" />
    <circle cx="0" cy="0" r="7" fill="#78350f" />
  </g>
</svg>
